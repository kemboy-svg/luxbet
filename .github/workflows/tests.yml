name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      pgsql:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: luxbet_testing
          POSTGRES_USER: luxbet
          POSTGRES_PASSWORD: luxbet_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luxbet -d luxbet_testing"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: luxbet_testing
      DB_USERNAME: luxbet
      DB_PASSWORD: luxbet_local_only
      REDIS_HOST: 127.0.0.1
      LUXBET_ENVIRONMENT_MODE: demo

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, intl, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan migrate --force

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Run CI checks (lint, static analysis, types, tests)
        run: composer ci:check

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Audit PHP dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          composer audit

      - name: Audit JavaScript dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
