# Local development stack for LuxBet (demo mode only).
#
#   docker compose up -d
#   docker compose exec app composer install
#   docker compose exec app php artisan migrate
#
# Database, Redis and Mailpit ports are bound to 127.0.0.1 only so they are
# never exposed on your network. Credentials here are for local use only.

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: luxbet-app:local
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        environment:
            DB_HOST: pgsql
            REDIS_HOST: redis
            MAIL_HOST: mailpit
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    nginx:
        image: nginx:1.27.3-alpine
        ports:
            - '127.0.0.1:8080:80'
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    pgsql:
        image: postgres:16.6-alpine
        ports:
            - '127.0.0.1:5432:5432'
        environment:
            POSTGRES_DB: luxbet
            POSTGRES_USER: luxbet
            POSTGRES_PASSWORD: luxbet_local_only
        volumes:
            - pgsql-data:/var/lib/postgresql/data
            - ./docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', 'luxbet', '-d', 'luxbet']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7.4.2-alpine
        ports:
            - '127.0.0.1:6379:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    mailpit:
        image: axllent/mailpit:v1.21
        ports:
            - '127.0.0.1:1025:1025'
            - '127.0.0.1:8025:8025'

volumes:
    pgsql-data:
    redis-data:
